name: KanjiScanner
options:
  bundleIdPrefix: com.asaaugustin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0

targets:
  KanjiScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KanjiScanner
    resources:
      - path: KanjiScanner/Resources/kanji_scanner.sqlite
      - path: KanjiScanner/Assets.xcassets
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: KanjiScanner/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Kanji Scanner uses your camera to capture printed Japanese text so it can look up kanji and words for you — entirely on-device, no photos are stored or sent anywhere."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaaugustin.KanjiScanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  KanjiScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KanjiScannerTests
    dependencies:
      - target: KanjiScanner
      - package: GRDB
        product: GRDB
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.asaaugustin.KanjiScannerTests

schemes:
  KanjiScanner:
    build:
      targets:
        KanjiScanner: all
        KanjiScannerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KanjiScannerTests
