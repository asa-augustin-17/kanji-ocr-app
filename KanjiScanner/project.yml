name: KanjiScanner
options:
  bundleIdPrefix: com.asaaugustin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2

targets:
  KanjiScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KanjiScanner
    resources:
      - path: KanjiScanner/Resources/kanji_scanner.sqlite
      - path: KanjiScanner/Resources/ppocrv5_rec.onnx
      - path: KanjiScanner/Resources/ppocrv5_dict.txt
      - path: KanjiScanner/Assets.xcassets
    dependencies:
      - package: GRDB
        product: GRDB
      - package: onnxruntime
        product: onnxruntime
    info:
      path: KanjiScanner/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Kanji Scanner uses your camera to capture printed Japanese text so it can look up kanji and words for you — entirely on-device, no photos are stored or sent anywhere."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaaugustin.KanjiScanner
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: XXQ9DMRYW7
    postBuildScripts:
      - name: Fix ONNX Runtime MinimumOSVersion
        script: |
          set -e
          FRAMEWORKS_PATH="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          for framework in "onnxruntime" "onnxruntime_extensions"; do
              PLIST="${FRAMEWORKS_PATH}/${framework}.framework/Info.plist"
              if [ -f "$PLIST" ]; then
                  /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" "$PLIST" 2>/dev/null || true
                  /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string ${IPHONEOS_DEPLOYMENT_TARGET}" "$PLIST"
              fi
          done

  KanjiScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KanjiScannerTests
    dependencies:
      - target: KanjiScanner
      - package: GRDB
        product: GRDB
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.asaaugustin.KanjiScannerTests

schemes:
  KanjiScanner:
    build:
      targets:
        KanjiScanner: all
        KanjiScannerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KanjiScannerTests
